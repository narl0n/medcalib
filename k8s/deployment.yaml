apiVersion: apps/v1
kind: Deployment
metadata:
  name: medcalib-api
  labels:
    app: medcalib-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medcalib-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: medcalib-api
    spec:
      containers:
        - name: api
          # The tag is replaced by the Jenkins pipeline (kubectl set image).
          image: medcalib-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
